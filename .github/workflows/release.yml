name: Release binaries

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  # Pinned for the zigbuild jobs (build-linux-zig matrix, macos-universal).
  # Must match a real ziglang.org artifact; 0.15+ uses the <arch>-<os> tarball
  # name order.
  ZIG_VERSION: 0.16.0

jobs:
  # Portable static Linux/x86_64 — the original musl-gcc path (no zig).
  build-musl-x86_64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache cargo registry / target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            target
          key: musl-x86_64-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - name: Install musl toolchain + build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools make flex bison autoconf automake libtool

      - name: Build static libpcap for musl
        run: |
          set -euxo pipefail
          cd /tmp
          # Source from the libpcap GitHub repo: github.com is always reachable
          # from Actions, unlike tcpdump.org (which can be blocked by CDN).
          git clone --depth 1 --branch libpcap-1.10.5 \
            https://github.com/the-tcpdump-group/libpcap libpcap-gh
          cd libpcap-gh
          autoreconf -i
          CC=musl-gcc AR=ar RANLIB=ranlib ./configure \
            --host=x86_64-linux-musl \
            --disable-shared --enable-static \
            --without-libnl --disable-dbus --disable-bluetooth \
            --disable-usb --disable-manual --without-dag \
            --without-septel --without-snf --disable-rdma --disable-srp
          make -j$(nproc)

      - name: Build release binary
        env:
          LIBPCAP_LIBDIR: /tmp/libpcap-gh
          LIBPCAP_VER: "1.10.5"
          RUSTFLAGS: "-C target-feature=+crt-static"
        run: cargo build --release --target x86_64-unknown-linux-musl

      - name: Verify fully static
        run: |
          file target/x86_64-unknown-linux-musl/release/sipmon
          ldd_output="$(ldd target/x86_64-unknown-linux-musl/release/sipmon 2>&1 || true)"
          file_output="$(file target/x86_64-unknown-linux-musl/release/sipmon)"
          case "$ldd_output:$file_output" in
            *"not a dynamic executable"*) ;;
            *"statically linked"*) ;;
            *"static-pie linked"*) ;;
            *) echo "ERROR: binary is not fully static"; exit 1 ;;
          esac

      - name: Package
        run: |
          cd target/x86_64-unknown-linux-musl/release
          cp sipmon sipmon-x86_64-unknown-linux-musl
          sha256sum sipmon-x86_64-unknown-linux-musl \
            > sipmon-x86_64-unknown-linux-musl.sha256

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            target/x86_64-unknown-linux-musl/release/sipmon-x86_64-unknown-linux-musl
            target/x86_64-unknown-linux-musl/release/sipmon-x86_64-unknown-linux-musl.sha256

  # Linux targets cross-compiled with zig from the x86_64 runner via the
  # Makefile (no per-arch toolchains or qemu needed). The Makefile builds the
  # cross libpcap per target with `zig cc` (cached under ~/.cache/sipmon/pcap-zig,
  # with a github clone + autoreconf fallback when tcpdump.org is unreachable)
  # and links via cargo-zigbuild. One matrix entry per target:
  #   - musl:    portable, fully static, zero runtime deps.
  #   - gnu:     glibc, dynamically linked — the interpreter + libc.so.6 +
  #              libpcap.so.1 come from the target host at runtime (zig's
  #              linker refuses to fall back from -lpcap to the static archive,
  #              so these can't be made self-contained).
  build-linux-zig:
    strategy:
      fail-fast: false
      matrix:
        include:
          - make-target: musl-aarch64
            rust-target: aarch64-unknown-linux-musl
            linkage: static
          - make-target: gnu-x86_64
            rust-target: x86_64-unknown-linux-gnu
            linkage: dynamic
          - make-target: gnu-aarch64
            rust-target: aarch64-unknown-linux-gnu
            linkage: dynamic
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache cargo registry / target / cross libpcap
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            target
            ~/.cache/sipmon/pcap-zig
          key: zig-${{ matrix.rust-target }}-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-zig${{ env.ZIG_VERSION }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }}

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y make flex bison autoconf automake libtool \
            git curl xz-utils

      - name: Install zig
        run: |
          curl -fsSL \
            "https://ziglang.org/download/${ZIG_VERSION}/zig-x86_64-linux-${ZIG_VERSION}.tar.xz" \
            | tar -xJ -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/zig-x86_64-linux-${ZIG_VERSION}" >> "$GITHUB_PATH"

      - name: Install cargo-zigbuild
        run: cargo install cargo-zigbuild --locked

      - name: Build
        run: make ${{ matrix.make-target }}

      - name: Verify linkage
        run: |
          bin="target/${{ matrix.rust-target }}/release/sipmon"
          file "$bin"
          case "${{ matrix.linkage }}" in
            static)
              file "$bin" | grep -Eq "statically linked|static-pie" \
                || { echo "ERROR: binary is not fully static"; exit 1; } ;;
            dynamic)
              file "$bin" | grep -q "dynamically linked" \
                || { echo "ERROR: binary is not dynamically linked"; exit 1; }
              readelf -d "$bin" | grep -q "libpcap.so.1" \
                || { echo "ERROR: binary does not declare its libpcap.so.1 dep"; exit 1; } ;;
          esac

      - name: Package
        run: |
          cd target/${{ matrix.rust-target }}/release
          cp sipmon sipmon-${{ matrix.rust-target }}
          sha256sum sipmon-${{ matrix.rust-target }} \
            > sipmon-${{ matrix.rust-target }}.sha256

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            target/${{ matrix.rust-target }}/release/sipmon-${{ matrix.rust-target }}
            target/${{ matrix.rust-target }}/release/sipmon-${{ matrix.rust-target }}.sha256

  # macOS universal2 (x86_64 + arm64) — zig as the linker, SDK libpcap.
  build-macos-universal:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Cache cargo registry / target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            target
          key: macos-universal-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-zig${{ env.ZIG_VERSION }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Install zig
        run: |
          curl -fsSL \
            "https://ziglang.org/download/${ZIG_VERSION}/zig-aarch64-macos-${ZIG_VERSION}.tar.xz" \
            | tar -xJ -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/zig-aarch64-macos-${ZIG_VERSION}" >> "$GITHUB_PATH"

      - name: Install cargo-zigbuild
        run: cargo install cargo-zigbuild --locked

      - name: Build
        run: make macos-universal

      - name: Verify universal2
        run: |
          file target/universal2-apple-darwin/release/sipmon
          file target/universal2-apple-darwin/release/sipmon | grep -q \
            "2 architectures" \
            || { echo "ERROR: binary is not universal2"; exit 1; }

      - name: Package
        run: |
          cd target/universal2-apple-darwin/release
          cp sipmon sipmon-universal2-apple-darwin
          # Ad-hoc signature: arm64 slices refuse to run unsigned once the
          # binary carries a quarantine attribute (e.g. downloaded from the
          # release page).
          codesign --force --sign - sipmon-universal2-apple-darwin
          shasum -a 256 sipmon-universal2-apple-darwin \
            > sipmon-universal2-apple-darwin.sha256

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            target/universal2-apple-darwin/release/sipmon-universal2-apple-darwin
            target/universal2-apple-darwin/release/sipmon-universal2-apple-darwin.sha256
