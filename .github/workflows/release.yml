name: Release musl binary

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-C target-feature=+crt-static"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache cargo registry / target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            target
          key: musl-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - name: Install musl toolchain + build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools make flex bison autoconf automake libtool linux-libc-dev

      - name: Build static libpcap for musl
        run: |
          set -euxo pipefail
          cd /tmp
          # Source from the libpcap GitHub repo: github.com is always reachable
          # from Actions, unlike tcpdump.org (which can be blocked by CDN).
          git clone --depth 1 --branch libpcap-1.10.5 \
            https://github.com/the-tcpdump-group/libpcap libpcap-gh
          cd libpcap-gh
          autoreconf -i
          # Cross-compiling can't run probe binaries, so force the Linux
          # PF_PACKET capture type explicitly instead of auto-detecting.
          CC=musl-gcc AR=ar RANLIB=ranlib ./configure \
            --host=x86_64-linux-musl \
            --with-pcap=linux \
            --disable-shared --enable-static \
            --without-libnl --disable-dbus --disable-bluetooth \
            --disable-usb --disable-manual --without-dag \
            --without-septel --without-snf --disable-rdma --disable-srp
          make -j$(nproc)

      - name: Build release binary
        env:
          LIBPCAP_LIBDIR: /tmp/libpcap-gh
          LIBPCAP_VER: "1.10.5"
        run: cargo build --release --target x86_64-unknown-linux-musl

      - name: Verify fully static
        run: |
          file target/x86_64-unknown-linux-musl/release/sipmon
          ldd_output="$(ldd target/x86_64-unknown-linux-musl/release/sipmon 2>&1 || true)"
          file_output="$(file target/x86_64-unknown-linux-musl/release/sipmon)"
          case "$ldd_output:$file_output" in
            *"not a dynamic executable"*) ;;
            *"statically linked"*) ;;
            *"static-pie linked"*) ;;
            *) echo "ERROR: binary is not fully static"; exit 1 ;;
          esac

      - name: Package
        run: |
          cd target/x86_64-unknown-linux-musl/release
          cp sipmon sipmon-x86_64-unknown-linux-musl
          sha256sum sipmon-x86_64-unknown-linux-musl > SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            target/x86_64-unknown-linux-musl/release/sipmon-x86_64-unknown-linux-musl
            target/x86_64-unknown-linux-musl/release/SHA256SUMS
